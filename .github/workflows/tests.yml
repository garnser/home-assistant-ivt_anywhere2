name: Regression tests

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m unittest discover -s tests -v
  home-assistant-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install homeassistant==2026.10.4 bosch-thermostat-client==0.28.2
      - run: python -m unittest discover -s tests_runtime -v
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [offline, home-assistant-runtime]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-stable-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Publish the tested manifest version if not already released
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("custom_components/ivt_anywhere2/manifest.json"))["version"])')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v${version}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag is already published."
            exit 0
          fi
          notes="docs/releases/${tag}.md"
          test -f "$notes"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$tag" --notes-file "$notes" --latest
